<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - My Orders</title>


    <!-- Bootstrap 5.3.3 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <style>

        /* =========================================
           GLOBAL
        ========================================= */

        :root {

            --primary: #2563eb;
            --primary-dark: #1d4ed8;

            --background: #f5f7fb;

            --text: #111827;
            --muted: #6b7280;

            --border: #e5e7eb;

        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #e0e7ff 0%,
                    transparent 35%
                ),
                var(--background);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

        }



        /* =========================================
           LOGIN WRAPPER
        ========================================= */

        .login-wrapper {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                30px 15px;

        }


        .login-container {

            width: 100%;

            max-width: 430px;

        }



        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            background: white;

            border:
                1px solid
                rgba(229, 231, 235, 0.8);

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 20px 60px
                rgba(15, 23, 42, 0.10);

        }



        /* =========================================
           BRAND HEADER
        ========================================= */

        .login-header {

            background:
                linear-gradient(
                    135deg,
                    #1d4ed8,
                    #2563eb
                );

            padding:
                34px 30px;

            text-align: center;

            color: white;

        }


        .brand-icon {

            width: 58px;

            height: 58px;

            margin:
                0 auto 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(255,255,255,0.15);

            border:
                1px solid
                rgba(255,255,255,0.2);

            border-radius: 15px;

            font-size: 1.5rem;

        }


        .brand-title {

            font-size: 1.5rem;

            font-weight: 750;

            margin-bottom: 5px;

        }


        .brand-subtitle {

            color:
                rgba(255,255,255,0.78);

            margin: 0;

            font-size: 0.9rem;

        }



        /* =========================================
           FORM AREA
        ========================================= */

        .login-body {

            padding:
                32px;

        }


        .form-label {

            font-size: 0.86rem;

            font-weight: 650;

            color: #374151;

            margin-bottom: 8px;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #9ca3af;

            z-index: 5;

        }


        .form-control {

            height: 48px;

            border:
                1px solid
                var(--border);

            border-radius: 10px;

            padding-left: 43px;

            padding-right: 43px;

            font-size: 0.92rem;

            box-shadow: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        .form-control::placeholder {

            color: #9ca3af;

        }


        .form-control:focus {

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);

        }



        /* =========================================
           PASSWORD BUTTON
        ========================================= */

        .password-toggle {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #9ca3af;

            width: 32px;

            height: 32px;

            border-radius: 7px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

        }


        .password-toggle:hover {

            background: #f3f4f6;

            color: #374151;

        }



        /* =========================================
           ERROR
        ========================================= */

        .login-error {

            background: #fef2f2;

            border:
                1px solid
                #fecaca;

            color: #991b1b;

            border-radius: 10px;

            padding:
                12px 14px;

            margin-bottom: 22px;

            font-size: 0.88rem;

        }


        .error-title {

            font-weight: 700;

            margin-bottom: 2px;

        }


        .error-text {

            color: #b91c1c;

        }



        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-btn {

            width: 100%;

            height: 48px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 0.94rem;

            font-weight: 700;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .login-btn:hover {

            color: white;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(37, 99, 235, 0.25);

        }


        .login-btn:active {

            transform:
                translateY(0);

        }



        /* =========================================
           FOOTER
        ========================================= */

        .login-footer {

            text-align: center;

            padding:
                0 30px 25px;

            color: #9ca3af;

            font-size: 0.78rem;

        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 480px) {

            .login-wrapper {

                padding:
                    20px 15px;

            }


            .login-header {

                padding:
                    28px 22px;

            }


            .login-body {

                padding:
                    25px 22px;

            }


            .login-footer {

                padding:
                    0 20px 22px;

            }

        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="login-container">


        <!-- =========================================
             LOGIN CARD
        ========================================== -->

        <div class="login-card">


            <!-- HEADER -->

            <div class="login-header">


                <div class="brand-icon">

                    <i class="bi bi-box-seam"></i>

                </div>


                <div class="brand-title">

                    My Orders

                </div>


                <p class="brand-subtitle">

                    Sign in to manage your orders

                </p>


            </div>



            <!-- BODY -->

            <div class="login-body">


                <!-- LOGIN ERROR -->

                {% if form.errors %}

                    <div
                        class="login-error"
                        role="alert"
                    >

                        <div class="error-title">

                            <i
                                class="bi
                                       bi-exclamation-circle
                                       me-1"
                            ></i>

                            Login failed

                        </div>


                        <div class="error-text">

                            Invalid username or password.
                            Please try again.

                        </div>

                    </div>

                {% endif %}



                <!-- LOGIN FORM -->

                <form method="post">

                    {% csrf_token %}



                    <!-- USERNAME -->

                    <div class="mb-4">


                        <label
                            for="id_username"
                            class="form-label"
                        >

                            Username

                        </label>


                        <div class="input-wrapper">


                            <i
                                class="bi
                                       bi-person
                                       input-icon"
                            ></i>


                            <input
                                type="text"
                                name="username"
                                id="id_username"
                                class="form-control"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                                autofocus
                            >


                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="mb-4">


                        <label
                            for="id_password"
                            class="form-label"
                        >

                            Password

                        </label>


                        <div class="input-wrapper">


                            <i
                                class="bi
                                       bi-lock
                                       input-icon"
                            ></i>


                            <input
                                type="password"
                                name="password"
                                id="id_password"
                                class="form-control"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                            >

                                <i
                                    class="bi
                                           bi-eye"
                                    id="passwordIcon"
                                ></i>

                            </button>


                        </div>

                    </div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-btn"
                    >

                        <i
                            class="bi
                                   bi-box-arrow-in-right"
                        ></i>

                        Login

                    </button>



                    <!-- REDIRECT -->

                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >

                </form>

            </div>



            <!-- FOOTER -->

            <div class="login-footer">

                My Orders &copy; {% now "Y" %}

            </div>


        </div>

    </div>

</div>



<!-- PASSWORD TOGGLE -->

<script>

    const passwordInput =
        document.getElementById("id_password");

    const togglePassword =
        document.getElementById("togglePassword");

    const passwordIcon =
        document.getElementById("passwordIcon");


    togglePassword.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type === "password";


            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";


            passwordIcon.classList.toggle(
                "bi-eye",
                !isPassword
            );


            passwordIcon.classList.toggle(
                "bi-eye-slash",
                isPassword
            );


            togglePassword.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

        }
    );

</script>


</body>

</html>
